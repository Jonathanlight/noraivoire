<!doctype html>

<!-- Demande de lien de réinitialisation. Données fictives. Aucun JS inline (CSP stricte). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié — NoraIvoire</title>
  <link rel="stylesheet" href="../packages/core/dist/noraivoire.css">
  <script type="module" src="../packages/core/dist/noraivoire.auto.js"></script>
</head>
<body>
  <main class="container py-12">
    <section class="card mx-auto stack" aria-labelledby="titre">
      <h1 id="titre" class="text-xl font-bold">Mot de passe oublié</h1>
      <p class="text-muted">Saisissez votre adresse : nous vous enverrons un lien de réinitialisation.</p>
      <form class="stack" action="#" method="post">
        <div class="field">
          <label class="field-label" for="email">Adresse e-mail</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required value="demo@" aria-invalid="true" aria-describedby="email-erreur">
          <p class="field-error" id="email-erreur">Adresse incomplète : ajoutez le domaine, par exemple demo@example.com.</p>
        </div>
        <button class="btn w-full" type="submit">Envoyer le lien</button>
      </form>
      <p class="text-sm text-center"><a class="link" href="login.html">Retour à la connexion</a></p>
    </section>
  </main>
</body>
</html>

<!-- Consultation et édition du profil. Données fictives. Aucun JS inline (CSP stricte). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil — NoraIvoire</title>
  <link rel="stylesheet" href="../packages/core/dist/noraivoire.css">
  <script type="module" src="../packages/core/dist/noraivoire.auto.js"></script>
</head>
<body>
  <header class="container cluster py-4">
    <a class="font-bold text-lg" href="dashboard.html">Espace Démo</a>
    <nav class="cluster" aria-label="Navigation de l'application">
      <a href="dashboard.html">Tableau de bord</a>
      <a href="notifications.html">Notifications <span class="badge" data-tone="danger">3</span></a>
      <a href="profile.html">Profil</a>
      <a href="settings.html">Paramètres</a>
    </nav>
  </header>
  <main class="container stack py-8">
    <h1 class="text-xl font-bold">Mon profil</h1>
    <section class="card cluster" aria-label="Résumé du compte">
      <span class="text-xl font-bold rounded-full p-4" role="img" aria-label="Avatar">UD</span>
      <div class="stack gap-1">
        <p class="font-bold">Utilisateur Démo</p>
        <p class="text-muted">demo@example.com</p>
      </div>
      <span class="badge" data-tone="primary">Pro</span>
    </section>
    <section class="card" aria-label="Modifier le profil">
    <form class="stack" action="#" method="post">
        <div class="stack gap-1">
          <label for="nom">Nom affiché</label>
          <input id="nom" name="nom" type="text" autocomplete="name" value="Utilisateur Démo">
        </div>
        <div class="stack gap-1">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" value="demo@example.com">
        </div>
        <div class="stack gap-1">
          <label for="bio">Présentation</label>
          <textarea id="bio" name="bio" rows="4"></textarea>
        </div>
      <div class="cluster">
        <button class="btn" type="submit">Enregistrer</button>
        <button class="btn" data-tone="neutral" type="reset">Annuler</button>
      </div>
    </form>
    </section>
  </main>
</body>
</html>

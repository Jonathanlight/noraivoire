<!doctype html>
<!-- NoraIvoire — recette « Connexion ». © 2026 Jonathan KABLAN — Propriétaire. -->
<!-- Formulaire de connexion par e-mail et mot de passe. Données fictives. Aucun JS inline (CSP stricte). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — NoraIvoire</title>
  <link rel="stylesheet" href="../packages/core/dist/noraivoire.css">
  <script type="module" src="../packages/core/dist/noraivoire.auto.js"></script>
</head>
<body>
  <main class="container py-12">
    <section class="card mx-auto stack" data-size="lg" aria-labelledby="titre">
      <h1 id="titre" class="text-xl font-bold">Connexion</h1>
      <form class="stack" action="#" method="post">
        <div class="stack gap-1">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="stack gap-1">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="cluster">
          <input id="remember" name="remember" type="checkbox">
          <label for="remember">Rester connecté</label>
        </div>
        <button class="btn w-full" type="submit" data-size="lg">Se connecter</button>
      </form>
      <p class="text-sm text-center"><a href="forgot-password.html">Mot de passe oublié ?</a> · <a href="signup.html">Créer un compte</a></p>
    </section>
  </main>
</body>
</html>

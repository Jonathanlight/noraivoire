<!doctype html>

<!-- Création de compte avec acceptation des conditions. Données fictives. Aucun JS inline (CSP stricte). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription — NoraIvoire</title>
  <link rel="stylesheet" href="../packages/core/dist/noraivoire.css">
  <script type="module" src="../packages/core/dist/noraivoire.auto.js"></script>
</head>
<body>
  <main class="container py-12">
    <section class="card mx-auto stack" data-size="lg" aria-labelledby="titre">
      <h1 id="titre" class="text-xl font-bold">Créer un compte</h1>
      <form class="stack" action="#" method="post">
        <div class="stack gap-1">
          <label for="name">Nom complet</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="stack gap-1">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="stack gap-1">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-aide">
          <p class="text-sm text-muted" id="password-aide">12 caractères minimum.</p>
        </div>
        <div class="cluster">
          <input id="terms" name="terms" type="checkbox" required>
          <label for="terms">J'accepte les conditions d'utilisation</label>
        </div>
        <button class="btn w-full" type="submit" data-size="lg">Créer mon compte</button>
      </form>
      <p class="text-sm text-center">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
    </section>
  </main>
</body>
</html>

# NoraIvoire — intégration continue (© Jonathan KABLAN, propriétaire).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist identique à la spec
        run: git diff --exit-code packages/core/dist
      - run: npm test
      - run: npm run check
      - run: npm run audit:security
      - run: npm run audit:deps

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          # Version figée : les goldens Linux (test/goldens/linux) en dépendent.
          flutter-version: 3.47.7
          channel: stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: copie du Dart généré et du modèle dans l'exemple
        run: npm run flutter:sync
      - name: flutter analyze (aucun avertissement ni info toléré)
        working-directory: examples/flutter_app
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
      # Inclut test/parity_test.dart : échoue si les mesures Flutter s'écartent de test/parity/flutter.json.
      - name: golden tests, tests de widgets et mesures de parité
        working-directory: examples/flutter_app
        # Goldens par plateforme : comparaison aux références Linux (workflow « goldens »).
        run: flutter test
      - name: diff des goldens en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: examples/flutter_app/test/failures/

  visual:
    # Régression visuelle (12 captures) et accessibilité axe-core de la page de démo.
    # Conteneur Playwright officiel, même version que @playwright/test : Chromium et polices
    # identiques à ceux de `npm run test:visual:update` (captures de tests/visual/__screenshots__/linux/).
    # Les navigateurs sont déjà dans l'image : aucun téléchargement ni cache à gérer.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist identique à la spec
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code packages/core/dist
      - name: captures et axe-core
        # En cas d'échec après un changement volontaire : `npm run test:visual:update` (Docker requis)
        # puis versionner tests/visual/__screenshots__/linux/.
        # Inclut tests/visual/parity.spec.mjs : échoue si les mesures CSS s'écartent de tests/parity/web.json.
        run: npm run test:visual
        env:
          HOME: /root
      - name: rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  react-native-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TypeScript strict du TSX généré et du modèle React Native
        run: |
          mkdir -p /tmp/rn/src && cp packages/core/dist/react-native/*.tsx /tmp/rn/src/
          cp templates/react-native/App.tsx /tmp/rn/
          cd /tmp/rn && npm init -y >/dev/null
          npm i --ignore-scripts --no-save typescript@5 react@19 @types/react@19 react-native@0.81
          npx tsc --strict --noEmit --jsx react-jsx --skipLibCheck --moduleResolution bundler --module esnext --target es2022 App.tsx src/noraivoire.tsx src/noraivoire-fx.tsx

  react-native-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist identique à la spec
        run: git diff --exit-code packages/core/dist
      - name: aucune licence copyleft ni dépendance runtime dans l'arbre npm
        run: npm run audit:licenses
      - name: rendu réel des composants React Native générés et du modèle (Jest + Testing Library)
        run: npm run test:rn -- --ci

  symfony:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run symfony:sync
      - name: dépendances Composer (aucun script ni plugin tiers)
        working-directory: adapters/symfony-bundle
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins
      - name: aucune licence copyleft dans l'arbre Composer
        working-directory: adapters/symfony-bundle
        run: composer licenses --format=json | php tool/check-licenses.php
      - name: PHPUnit
        working-directory: adapters/symfony-bundle
        run: vendor/bin/phpunit

  jsp:
    runs-on: ubuntu-latest
    env:
      TOMCAT_VERSION: '11.0.27'
      # Somme publiée par Apache (archive.apache.org/dist/tomcat/…/apache-tomcat-11.0.27.tar.gz.sha512).
      TOMCAT_SHA512: 'a617896307cada4884b24f80c4e977ddad8b3e0f88ce0e2a6eea29d5f332498e276ae5976c227a9c8daecf05c7c90def684a3766dd5a81f47a56d8b1adf43dc3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tomcat (archive Apache, somme SHA-512 vérifiée)
        run: |
          curl -fsSLo /tmp/tomcat.tar.gz "https://archive.apache.org/dist/tomcat/tomcat-11/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz"
          echo "${TOMCAT_SHA512}  /tmp/tomcat.tar.gz" | sha512sum -c -
          mkdir -p /tmp/tomcat && tar -xzf /tmp/tomcat.tar.gz -C /tmp/tomcat --strip-components=1
          echo "CATALINA_HOME=/tmp/tomcat" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: exécution réelle des modèles JSP (Tomcat, JSTL vérifiée par SHA-256)
        run: npm run test:jsp

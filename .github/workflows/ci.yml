# NoraIvoire — intégration continue (© Jonathan KABLAN, propriétaire).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist identique à la spec
        run: git diff --exit-code packages/core/dist
      - run: npm test
      - run: npm run check
      - run: npm run audit:security
      - run: npm run audit:deps

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: analyse du Dart généré
        run: |
          flutter create --no-pub /tmp/nora_probe
          cp packages/core/dist/flutter/*.dart /tmp/nora_probe/lib/
          cd /tmp/nora_probe && flutter pub get && flutter analyze lib/noraivoire.dart lib/noraivoire_fx.dart

  react-native-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TypeScript strict du TSX généré
        run: |
          mkdir -p /tmp/rn && cp packages/core/dist/react-native/*.tsx /tmp/rn/
          cd /tmp/rn && npm init -y >/dev/null
          npm i --ignore-scripts --no-save typescript@5 react@19 @types/react@19 react-native@0.81
          npx tsc --strict --noEmit --jsx react-jsx --skipLibCheck --moduleResolution bundler --module esnext --target es2022 noraivoire.tsx noraivoire-fx.tsx
